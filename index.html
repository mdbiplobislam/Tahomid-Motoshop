    <script>
      // Safeguard against environments where window.fetch has only a getter
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || Window.prototype;
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            var orig = (desc && desc.get) ? desc.get.call(window) : window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() { return this._customFetch || orig; },
              set: function(fn) { this._customFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }
      })();
    </script>
